# 智策投研 — 宝塔面板 Nginx 配置
# 
# 使用方式:
# 1. 宝塔面板 → 网站 → 添加站点 → 填写域名
# 2. 网站 → 设置 → 配置文件 → 粘贴以下内容
# 3. 将 web-pc/dist/ 上传到 /www/wwwroot/ai-stock-predict/
# 4. 重载 Nginx

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名或 IP

    # 前端静态文件 (宝塔建议放在 /www/wwwroot/ 下)
    root /opt/ai-stock-predict/web-pc/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理 (SSE 长连接支持)
    location /api/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 日志
    access_log /www/wwwlogs/ai-stock-predict.log;
    error_log /www/wwwlogs/ai-stock-predict-error.log;
}
