# 智策投研 — Docker Compose 部署
# 
# 包含: PostgreSQL + MySQL + Go 服务端
# 如果使用宝塔面板管理 Nginx，不需要启动 nginx 服务
# 宝塔 Nginx 配置见: docker/baota-nginx.conf
#
# 启动:  docker compose -f docker/docker-compose.yml up -d
# 查看:  docker compose -f docker/docker-compose.yml ps
# 停止:  docker compose -f docker/docker-compose.yml down

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock123
      POSTGRES_DB: stock_predict
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_predict"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: stock
      MYSQL_PASSWORD: stock123
      MYSQL_DATABASE: stock_predict
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    image: crpi-t3tis8f2l2fb8jc9-vpc.cn-hangzhou.personal.cr.aliyuncs.com/lijiangbo/ai-stock-predict:latest
    container_name: aip-server
    # 开发时用 build 从本地构建，部署时拉取远程镜像
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_DSN: "host=postgres user=stock password=stock123 dbname=stock_predict port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      MYSQL_DSN: "stock:stock123@tcp(mysql:3306)/stock_predict?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai"
      PG_DSN: "host=postgres dbname=stock_predict user=stock password=stock123"
      APP_ROOT: "/app"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # 如果不用宝塔面板，可以启用以下 nginx 服务
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ../web-pc/dist:/usr/share/nginx/html:ro
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - server
  #   restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
